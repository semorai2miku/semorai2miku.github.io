baseURL = 'https://semorai2miku.github.io/'
title = 'semorai blog'
theme = 'PaperMod'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  env = 'production'
  description = '写点什么...'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = '垃圾桶'
    Content = '写点什么...'

[[menus.main]]
  name = '文章'
  pageRef = '/posts'
  weight = 10

[[menus.main]]
  name = '目录'
  pageRef = '/catalogue'
  weight = 20
  
[[menus.main]]
  name = '书架'
  pageRef = '/posts/books'
  weight = 25

[[menus.main]]
  name = '搜索'
  pageRef = '/search'
  weight = 30

[[menus.main]]
  name = '关于'
  pageRef = '/about'
  weight = 40

[caches.images]
  dir = ':cacheDir/images'

